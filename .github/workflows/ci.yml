name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Contract tests
        run: pytest tests/contract -v

      # tests/integration requiere RabbitMQ + PostgreSQL + MinIO (docker-compose.test.yml,
      # puertos 5673/5433) y, en algunos casos, Nginx/auth-service: no se ejecuta en CI.
