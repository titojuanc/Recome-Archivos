events {}

http {
  resolver 127.0.0.11 valid=30s;

  server {
    listen 8080;

    # Subrequest interno de autorizacion: recibe Authorization + X-Solicitud-Id,
    # responde 200 (+ headers X-Bucket/X-Object-Key), 401, 403 o 404.
    location = /auth {
      internal;
      set $auth_upstream "auth-service-test:8001";
      proxy_pass http://$auth_upstream/auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Solicitud-Id $http_x_solicitud_id;
      proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/reportes/(?<solicitud_id>[^/]+)$ {
      auth_request /auth;
      auth_request_set $bucket $upstream_http_x_bucket;
      auth_request_set $object_key $upstream_http_x_object_key;
      auth_request_set $auth_reason $upstream_http_x_auth_reason;

      # Traduce fallos de autorizacion en respuestas propias del webserver, sin
      # exponer detalles internos. auth_request solo soporta de forma nativa los
      # codigos 200/401/403 en el subrequest; el caso "no encontrado" tambien se
      # expone como 403 desde /auth, distinguido via X-Auth-Reason.
      error_page 401 = @unauthorized;
      error_page 403 = @denied;

      set $http_x_solicitud_id $solicitud_id;

      # Redirige internamente a un location separado para el proxy real a MinIO,
      # de forma que su propio error_page (para errores nativos de MinIO) no
      # pise el error_page usado arriba para el resultado de /auth.
      try_files /__no_existe__ @proxy_minio;
    }

    location @denied {
      if ($auth_reason = "not_found") {
        return 404;
      }
      return 403;
    }

    # Una vez autorizado, proxea directamente el objeto real desde MinIO
    # (unico hop interno, sin copiar el archivo a disco ni exponer MinIO
    # directamente al cliente).
    location @proxy_minio {
      set $minio_upstream "minio-test:9000";
      proxy_pass http://$minio_upstream/$bucket/$object_key;
      proxy_intercept_errors on;
      error_page 404 500 502 503 = @minio_unavailable;
    }

    location @unauthorized {
      return 401;
    }

    # Traduce cualquier error nativo de MinIO (objeto eliminado, servicio caido)
    # en una respuesta generica, sin filtrar el body/headers originales de MinIO.
    location @minio_unavailable {
      return 502;
    }
  }
}
