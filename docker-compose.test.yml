services:
  rabbitmq-test:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-reportes-test:
    image: postgres:16
    environment:
      POSTGRES_DB: reportes
      POSTGRES_USER: reportes
      POSTGRES_PASSWORD: reportes
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportes -d reportes"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-test:
    image: quay.io/minio/minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: reportes-test
      MINIO_ROOT_PASSWORD: reportes-test-secret
    ports:
      - "9002:9000"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service-test:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      JWT_SECRET: testing-secret
      DATABASE_URL: postgresql+psycopg://reportes:reportes@postgres-reportes-test:5432/reportes
    command: >
      bash -c "pip install --quiet -e . && uvicorn src.webserver.auth_service.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    depends_on:
      - postgres-reportes-test

  nginx-test:
    image: nginx:1.27
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - auth-service-test
      - minio-test
