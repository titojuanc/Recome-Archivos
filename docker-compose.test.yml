services:
  rabbitmq-test:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-reportes-test:
    image: postgres:16
    environment:
      POSTGRES_DB: reportes
      POSTGRES_USER: reportes
      POSTGRES_PASSWORD: reportes
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportes -d reportes"]
      interval: 5s
      timeout: 5s
      retries: 10
